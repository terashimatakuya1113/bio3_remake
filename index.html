<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAST SHIPMENT ―最終便―</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DotGothic16&family=Shippori+Mincho:wght@700&display=swap">
<style>
  /* 単一の暗い画面。ゲーム画面(4:3)を中央に置き、タッチ端末では下に操作ボタン */
  :root {
    --void: #000;
    --ink: #e8e4d8;
    --dim: #8a857a;
    --blood: #b01a10;
    --panel: rgba(4, 6, 10, 0.82);
    --line: #5a5a62;
    --pixel: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--void); color: var(--ink); font-family: var(--pixel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding-inline: 16px; box-sizing: border-box; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #screen {
    position: relative; container-type: inline-size;
    width: min(100%, calc((100dvh - var(--pad-bottom, 48px)) * 4 / 3)); aspect-ratio: 4 / 3; max-width: 100%;
    background: var(--void); overflow: hidden;
  }
  #game { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .layer { position: absolute; inset: 0; }
  #fade { background: var(--void); opacity: 1; pointer-events: none; }
  #hurt { background: var(--blood); opacity: 0; pointer-events: none; mix-blend-mode: screen; }

  #title, #intro, #ending, #dead { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2.5cqw; background: var(--void); }
  #title .eyebrow { font-size: 2.6cqw; letter-spacing: 0.4em; color: var(--dim); }
  #title h1 { margin: 0; font-weight: 400; font-size: 11cqw; letter-spacing: 0.08em; color: var(--ink); text-shadow: 0.5cqw 0.5cqw 0 var(--blood); }
  #title .sub { font-size: 3.2cqw; color: var(--ink); }
  .blink { font-size: 3cqw; color: var(--dim); animation: blink 1.2s steps(2) infinite; margin-top: 4cqw; }
  @keyframes blink { 50% { opacity: 0; } }
  #intro { background: transparent; font-size: 3.6cqw; line-height: 1.9; white-space: pre-line; opacity: 0; pointer-events: none; }
  #dead h2 { margin: 0; font-weight: 400; letter-spacing: 0.1em; color: var(--blood); font-size: 9cqw; }
  #dead { background: transparent; }
  #dead p { margin: 0; font-size: 3.2cqw; color: var(--dim); }
  #title h1 { font-size: 10cqw; }
  #title .sub { letter-spacing: 0.3em; }
  /* タイトル：薄暗い部屋の背景に、金属の質感の題字（当時のタイトル画面の作法） */
  #title { background: radial-gradient(ellipse at 50% 45%, rgba(20,0,0,0.35) 0%, rgba(0,0,0,0.78) 62%, #000 100%); gap: 1.2cqw; }
  #title .eyebrow { font-family: "Cinzel", serif; font-size: 2.2cqw; letter-spacing: 0.6em; color: #9a8a80; }
  #title h1 { font-family: "Cinzel", serif; font-weight: 900; font-size: 9.6cqw; letter-spacing: 0.06em; line-height: 1;
    background: linear-gradient(180deg, #fbfbf6 0%, #c9c6bd 38%, #6d6a64 52%, #d8d4ca 70%, #8c877e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 0.15cqw #000) drop-shadow(0.4cqw 0.5cqw 0 #3a0000) drop-shadow(0 0 2.4cqw rgba(170,10,0,0.55)); }
  #title .sub { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 4.6cqw; letter-spacing: 0.9em; padding-left: 0.9em; color: #c01810; text-shadow: 0 0 1.6cqw rgba(200,20,0,0.6), 0.3cqw 0.3cqw 0 #000; }
  #title .blink { font-family: "Cinzel", serif; letter-spacing: 0.3em; color: #c8c0b4; margin-top: 7cqw; font-size: 2.8cqw; }
  #title .copy { position: absolute; bottom: 4%; font-family: "Cinzel", serif; font-size: 1.8cqw; letter-spacing: 0.2em; color: #6a645c; }
  /* ブラウン管の映り：走査線と周辺の暗がり（V キーで切り替え） */
  #scan { position: absolute; inset: 0; pointer-events: none; z-index: 50; display: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2) 100%) 0 0 / 100% calc(100% / 240),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.35) 100%); }
  #screen.crt #scan { display: block; }
  /* 原作どおり、プレイ中の画面には体調も弾数も出さない（ステータス画面で確かめる） */
  #hud, #cond { display: none !important; }
  #ending { justify-content: flex-start; padding-top: 9cqw; gap: 1.6cqw; }
  #ending h2 { margin: 0 0 2cqw; font-weight: 400; font-size: 5.6cqw; letter-spacing: 0.12em; color: var(--ink); text-shadow: 0.4cqw 0.4cqw 0 var(--blood); opacity: 0; }
  #end-body p { margin: 0 8%; font-size: 3.3cqw; line-height: 1.9; color: var(--ink); transition: none; }
  #end-foot { margin-top: 3cqw; }
  #select { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6%; box-sizing: border-box; background: rgba(60, 0, 0, 0.25); }
  .sel-box { width: 88%; background: var(--panel); border: 0.4cqw solid #8a2a20; padding: 2.4cqw 3cqw; box-sizing: border-box; }
  #sel-prompt { font-size: 4.2cqw; color: #f0d0c0; margin-bottom: 1.8cqw; letter-spacing: 0.05em; }
  #sel-opts { display: flex; justify-content: space-around; gap: 3cqw; font-size: 4cqw; }
  #sel-opts span { padding-left: 3.6cqw; position: relative; color: var(--dim); }
  #sel-opts span.sel { color: #fff; }
  #sel-opts span.sel::before { content: "▶"; position: absolute; left: 0; font-size: 0.75em; top: 0.25em; color: #e04030; }
  .sel-track { margin-top: 2cqw; height: 1cqw; background: #2a0a08; }
  #sel-bar { height: 100%; background: #d03020; transform-origin: left; }
  #chapter { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-size: 4.6cqw; letter-spacing: 0.3em; color: var(--ink); text-shadow: 0.4cqw 0.4cqw 0 #000; pointer-events: none; animation: chap 4s ease forwards; white-space: pre-line; }
  @keyframes chap { 0% { opacity: 0; } 20% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

  /* 文字窓：枠のない半透明の黒帯に白い文字（原作の文字窓の作法） */
  #msg {
    position: absolute; left: 7%; right: 7%; bottom: 5%; min-height: 19%;
    background: rgba(0, 0, 0, 0.62); box-sizing: border-box;
    padding: 2.2cqw 4cqw; font-size: 4.1cqw; line-height: 1.65; white-space: pre-line; color: #f2f2ec;
    text-shadow: 0.25cqw 0.25cqw 0 #000;
  }
  #choice { display: flex; gap: 9cqw; justify-content: center; margin-top: 1cqw; }
  #choice span { padding-left: 3.6cqw; position: relative; color: var(--dim); }
  #choice span.sel { color: var(--ink); }
  #choice span.sel::before { content: "▶"; position: absolute; left: 0; font-size: 0.75em; top: 0.25em; }

  #doc { background: rgba(0, 0, 0, 0.88); display: flex; align-items: center; justify-content: center; }
  #doc .sheet { width: 64%; max-height: 94%; overflow: hidden; background: #cfc8b0; color: #2a241c; padding: 3cqw 4.5cqw; box-sizing: border-box; box-shadow: 1cqw 1cqw 0 rgba(0,0,0,.6); }
  #doc-title { margin: 0 0 1.6cqw; font-size: 3.4cqw; font-weight: 400; border-bottom: 0.3cqw solid #6a604c; padding-bottom: 1cqw; }
  #doc-body { font-size: 2.35cqw; line-height: 1.5; white-space: pre-line; }
  #doc .hint { text-align: right; font-size: 2.2cqw; color: #6a604c; margin-top: 1cqw; }

  #hud { position: absolute; right: 4%; bottom: 4%; font-size: 3.4cqw; color: #9ce08a; text-shadow: 0.3cqw 0.3cqw 0 #000; letter-spacing: 0.1em; }
  #hud b { font-weight: 400; font-size: 5.2cqw; }
  #cond { position: absolute; left: 4%; top: 4%; font-size: 3.6cqw; letter-spacing: 0.15em; padding: 0.8cqw 2cqw; background: var(--panel); border: 0.3cqw solid var(--line); }
  #cond[data-level="fine"] { color: #7ee07e; }
  #cond[data-level="caution"] { color: #e0c050; }
  #cond[data-level="danger"] { color: #e04030; }

  .keys { font-size: 13px; color: var(--dim); text-align: center; line-height: 1.6; }
  .keys kbd { font-family: var(--pixel); color: var(--ink); border: 1px solid var(--line); padding: 0 5px; }

  #touch { display: none; width: min(100%, 520px); justify-content: space-between; align-items: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (pointer: coarse) {
    :root { --pad-bottom: 190px; }
    #touch { display: flex; }
    .keys { display: none; }
  }
  .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
  .btns { display: grid; grid-template-columns: repeat(2, 72px); gap: 10px; }
  #touch button {
    font-family: var(--pixel); color: var(--ink); background: #15161a; border: 2px solid var(--line); border-radius: 8px;
    font-size: 15px; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #touch button.on { background: #3a3c44; }
  .btns button { height: 64px; }
  .btns button:nth-child(n+3) { font-size: 13px; }
  /* ステータス画面：座標は 320x240 の 1 ドット = --u */
  #menu { --u: calc(100cqw / 320); font-size: calc(var(--u) * 10); color: #f0f0f0; }
  #menu .mx { position: absolute; box-sizing: border-box; }
  #menu .frame { border: calc(var(--u) * 6) solid; border-image: linear-gradient(135deg, #e4e6ea 0%, #a4a9b1 30%, #6a7079 52%, #bcc1c8 74%, #7a8088 100%) 1;
    box-shadow: 0 0 0 calc(var(--u)) #0a0a0c, inset 0 0 0 calc(var(--u)) #2a2c30; }
  #menu .frame .hole { position: absolute; inset: 0; box-shadow: inset 0 0 0 calc(var(--u)) #d8dade, inset 0 0 0 calc(var(--u) * 2) #000; }
  #menu .bolt { position: absolute; width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 20%, #9aa0a8 55%, #2a2c30 100%); }
  #menu .bolt.tl { left: calc(var(--u) * -5); top: calc(var(--u) * -5); } #menu .bolt.tr { right: calc(var(--u) * -5); top: calc(var(--u) * -5); }
  #menu .bolt.bl { left: calc(var(--u) * -5); bottom: calc(var(--u) * -5); } #menu .bolt.br { right: calc(var(--u) * -5); bottom: calc(var(--u) * -5); }
  .m-cmds { background: linear-gradient(180deg, #1c1e3a, #0c0d1c); border: calc(var(--u)) solid #8a8f9a; box-shadow: inset 0 0 0 calc(var(--u)) #2e3250; padding: calc(var(--u) * 3); }
  #m-cmds { display: flex; flex-direction: column; gap: calc(var(--u) * 2); height: 100%; }
  #m-cmds span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 11); letter-spacing: 0.05em; color: #e8e8f0; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
  #m-cmds span.off { color: #6a6c80; }
  #m-cmds span.sel { background: linear-gradient(180deg, #6a7cff 0%, #3640c8 50%, #7a2aa8 100%); box-shadow: inset 0 0 0 calc(var(--u)) #c8d0ff; color: #fff; }
  .m-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 2); }
  .m-tabs span { display: flex; align-items: center; justify-content: center; font-size: calc(var(--u) * 10); font-weight: 700; letter-spacing: 0.04em; color: #101014;
    background: linear-gradient(180deg, #eef0f2 0%, #b0b5bc 55%, #8a9098 100%); border: calc(var(--u)) solid #2a2c30; box-shadow: inset calc(var(--u)) calc(var(--u)) 0 #fff, inset calc(var(--u) * -1) calc(var(--u) * -1) 0 #5a5e66; }
  .m-tabs span.sel { background: linear-gradient(180deg, #fff7c8 0%, #e8c860 100%); }
  .blink-on .m-tabs span.sel { outline: calc(var(--u)) solid #fff; }
  .m-grid { background: linear-gradient(135deg, #b8bcc4, #6a7078); border: calc(var(--u)) solid #1a1c20; padding: calc(var(--u) * 2); }
  #m-items { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: calc(var(--u) * 2); height: 100%; }
  .slot { position: relative; background: linear-gradient(160deg, #3a4a9a 0%, #1e2866 60%, #141a48 100%); box-shadow: inset calc(var(--u)) calc(var(--u)) 0 #6a7ad0, inset calc(var(--u) * -1) calc(var(--u) * -1) 0 #0a0e2a;
    display: flex; align-items: center; justify-content: center; }
  .slot img { width: calc(var(--u) * 34); height: calc(var(--u) * 26); image-rendering: pixelated; }
  .slot b { position: absolute; left: calc(var(--u) * 2); bottom: 0; font-weight: 400; font-size: calc(var(--u) * 10); color: #6af06a; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
  .slot em { position: absolute; right: calc(var(--u) * 2); top: 0; font-style: normal; font-size: calc(var(--u) * 8); color: #ffe070; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
  .slot.sel { box-shadow: inset 0 0 0 calc(var(--u)) #fff, inset 0 0 0 calc(var(--u) * 2) #3040c0; }
  .blink-on .slot.sel { box-shadow: inset 0 0 0 calc(var(--u) * 2) #ffe060; }
  .slot.from { box-shadow: inset 0 0 0 calc(var(--u) * 2) #f05050; }
  .m-ecg { background: #0a0c10; border: calc(var(--u)) solid #8a8f9a; box-shadow: inset 0 0 0 calc(var(--u)) #2a2c30; }
  .m-ecg canvas { position: absolute; left: calc(var(--u) * 11); top: calc(var(--u) * 2); width: calc(var(--u) * 60); height: calc(var(--u) * 29); image-rendering: pixelated; }
  .ecg-label { position: absolute; left: calc(var(--u) * 1); top: calc(var(--u) * 6); width: calc(var(--u) * 9); writing-mode: vertical-rl; text-orientation: upright; font-size: calc(var(--u) * 7); line-height: 1; color: #9aa0ac; letter-spacing: calc(var(--u) * -1); }
  #m-cond-text { position: absolute; right: calc(var(--u) * 4); bottom: calc(var(--u) * 0); line-height: 1.1; font-size: calc(var(--u) * 10); text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
  #m-cond[data-level="fine"] #m-cond-text { color: #58f058; }
  #m-cond[data-level="caution"] #m-cond-text { color: #f0d040; }
  #m-cond[data-level="danger"] #m-cond-text { color: #f04838; }
  .m-equip { background: linear-gradient(160deg, #3a4a9a 0%, #1e2866 60%, #141a48 100%); border: calc(var(--u)) solid #8a8f9a; box-shadow: inset 0 0 0 calc(var(--u)) #0a0e2a; display: flex; align-items: center; justify-content: center; }
  .m-equip img { width: calc(var(--u) * 34); height: calc(var(--u) * 26); image-rendering: pixelated; margin-left: calc(var(--u) * 6); }
  .m-equip b { position: absolute; left: calc(var(--u) * 14); bottom: calc(var(--u) * 1); font-weight: 400; font-size: calc(var(--u) * 11); color: #6af06a; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
  .m-equip .arrow { position: absolute; left: calc(var(--u) * 2); top: calc(var(--u) * 15); width: 0; height: 0; border-style: solid; border-width: calc(var(--u) * 6) 0 calc(var(--u) * 6) calc(var(--u) * 7); border-color: transparent transparent transparent #d8dce4; }
  .m-name { font-size: calc(var(--u) * 12); letter-spacing: 0.06em; color: #fff; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000, calc(var(--u) * -1) 0 0 #000; }
  .m-bar { background: linear-gradient(180deg, #4a4e56, #2a2d33); border: calc(var(--u)) solid #9aa0a8; box-shadow: inset 0 0 0 calc(var(--u)) #16181c; padding: calc(var(--u) * 3) calc(var(--u) * 6); }
  #m-desc { white-space: pre-line; font-size: calc(var(--u) * 9.5); line-height: 1.25; color: #f4f4f4; text-shadow: calc(var(--u)) calc(var(--u)) 0 #000; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="screen">
  <canvas id="game" width="320" height="240"></canvas>
  <div id="cond" hidden></div>
  <div id="hud" hidden><span id="wname">HANDGUN</span> <b id="ammo">10</b></div>
  <div id="msg" class="layer-msg" hidden><div id="msg-text"></div><div id="choice" hidden></div></div>
  <div id="doc" class="layer" hidden>
    <div class="sheet"><h2 id="doc-title"></h2><div id="doc-body"></div><div class="hint">▶ 閉じる</div></div>
  </div>
  <div id="menu" class="layer" hidden></div>
  <div id="hurt" class="layer"></div>
  <div id="fade" class="layer"></div>
  <div id="select" class="layer" hidden>
    <div class="sel-box"><div id="sel-prompt"></div><div id="sel-opts"></div><div class="sel-track"><div id="sel-bar"></div></div></div>
  </div>
  <div id="chapter" hidden></div>
  <div id="intro" class="layer" hidden>1998年10月2日 深夜
ヘイロウ・クリーク市郊外
ヴェスパー製薬 北部物流センター</div>
  <div id="dead" class="layer" hidden><h2>YOU DIED</h2><p class="blink">▶ CONTINUE（部屋の入口から）</p></div>
  <div id="ending" class="layer" hidden><h2 id="end-title"></h2><div id="end-body"></div><p id="end-foot" class="blink"></p></div>
  <div id="scan"></div>
  <div id="title" class="layer">
    <div class="eyebrow">A SURVIVAL HORROR HOMAGE</div>
    <h1>LAST SHIPMENT</h1>
    <div class="sub">―　最　終　便　―</div>
    <div class="blink">PRESS START BUTTON</div>
    <div class="copy">© 1998 VESPER PHARMACEUTICAL ― A FAN HOMAGE</div>
  </div>
</div>

<div class="keys">
  <kbd>↑↓←→</kbd> 移動（ラジコン操作）　<kbd>X</kbd>/<kbd>Shift</kbd> 走る　<kbd>Z</kbd> 調べる・撃つ　<kbd>C</kbd> 構える（押し続け）<br>
  <kbd>↓</kbd>+<kbd>X</kbd> クイックターン　<kbd>I</kbd>/<kbd>Tab</kbd> ステータス画面　<kbd>V</kbd> ブラウン管の映り 切替
</div>

<div id="touch">
  <div class="pad">
    <span></span><button data-btn="up" aria-label="前進">▲</button><span></span>
    <button data-btn="left" aria-label="左を向く">◀</button><span></span><button data-btn="right" aria-label="右を向く">▶</button>
    <span></span><button data-btn="down" aria-label="後退">▼</button><span></span>
  </div>
  <div class="btns">
    <button data-btn="aim">構え</button>
    <button data-btn="run">走る</button>
    <button data-btn="action">調べる／撃つ</button>
    <button data-btn="menu">ステータス</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
